# Sentiment-Score-Risk configuration (Phase 1)
sample:
  start: "2017-01-01"     # GDELT DOC timeline coverage starts here
  end: "2025-12-31"
  market_start: "2012-01-01"  # extra market history for later GARCH warm-up

market:
  tickers: ["SPY", "^VIX", "^VIX3M", "^VIX9D"]

gdelt:
  start: "20170101000000"
  end: "20251231235959"
  queries:
    # primary: plain keyword query, US English sources
    kw_stock_market: "\"stock market\" sourcecountry:US sourcelang:english"
    # sensitivity: GDELT's own stock-market theme tag
    stockmarket: "theme:ECON_STOCKMARKET sourcecountry:US sourcelang:english"
  primary: kw_stock_market

fomc:
  years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  # release time assumed for alignment (scheduled statements are 14:00 ET);
  # we conservatively treat every statement as known at 16:00 ET of its date.
  assumed_release_time_et: "16:00"

sentiment:
  zscore_window: 250     # trading days of history for the rolling baseline
  zscore_min_periods: 120

phase2:
  window: 500          # user chose 2026-11-22 (sentiment z starts 2017-06)
  refit_every: 21      # same as Market-Risk-Engine primary
  significance: 0.05

phase3:
  tenor_days: 30
  entry_every: 21
  iv_mult: 0.9            # ATM IV ~ 0.9 x VIX (sensitivity 0.85 / 1.0)
  option_cost: 0.01       # of straddle value, at open and at close (sens 0.005 / 0.02)
  hedge_cost_bp: 1.0
  notional: 1000000
  z_skip: -2.0            # fixed ex ante, not optimised
  term_ratio_skip: 1.0    # VIX/VIX3M > 1 = inverted
  # Heston spot-vol link for stress (Heston-Option-Risk reports/phase3_params.json, 2026-11-20)
  heston_unconstrained: {sigma: 2.245687, rho: -0.774007}
  heston_feller: {sigma: 0.901058, rho: -0.999}
